name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build ad-hoc release and package DMG
        run: ./scripts/release.sh

      - name: Generate checksum
        id: checksum
        run: echo "sha256=$(shasum -a 256 dist/*.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.dmg
          body: |
            SHA-256: `${{ steps.checksum.outputs.sha256 }}`
